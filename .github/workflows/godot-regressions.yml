name: Godot regressions

on:
  pull_request:
    paths:
      - 'Scripts/**'
      - 'Assets/**'
      - 'fonts/**'
      - 'UI/**'
      - 'tests/**'
      - '*.tscn'
      - 'project.godot'
      - '.github/workflows/godot-regressions.yml'
  push:
    branches: [main]
    paths:
      - 'Scripts/**'
      - 'Assets/**'
      - 'fonts/**'
      - 'UI/**'
      - 'tests/**'
      - '*.tscn'
      - 'project.godot'
      - '.github/workflows/godot-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check project asset references
        run: python3 tests/check_project.py
      - name: Install verified Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 2 --silent --show-error \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Run gameplay and ENet regressions
        run: python3 tests/run_regressions.py /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Import and exercise actual scenes
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|ERROR:|Parse Error' /tmp/import.log
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/runtime_smoke.gd 2>&1 | tee /tmp/runtime.log
          ! grep -E 'SCRIPT ERROR|ERROR:|Parse Error' /tmp/runtime.log
      - name: Exercise three real networked scenes
        run: python3 tests/run_scene_network.py /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Exercise online handoff contracts
        shell: bash
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script tests/online_contracts.gd 2>&1 | tee /tmp/contracts.log
          ! grep -E 'SCRIPT ERROR|ERROR:|Parse Error' /tmp/contracts.log
      - name: Exercise dedicated server and three clients
        run: python3 tests/run_central_network.py /tmp/Godot_v4.7.2-stable_linux.x86_64
      - name: Read matching PARDEX control-plane source
        uses: actions/checkout@v4
        with:
          repository: SerkanAydin06/Pardex
          ref: 634dfd1f951574497f028c04d4fc73426e651f96
          path: tests/pardex
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install control-plane test dependency
        run: npm --prefix tests/pardex/server ci
      - name: Exercise real PARDEX and HUKUM online lifecycle
        run: node tests/run_pardex_online.js /tmp/Godot_v4.7.2-stable_linux.x86_64 tests/pardex/server
