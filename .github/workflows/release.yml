name: Release builds

# Builds Windows, Linux and macOS game packages plus a Linux dedicated server.
# Runs on version tags (v1.0.0) and on demand. A tag also creates a draft
# GitHub release with the packages attached; nothing is published automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2
  GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
  TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check project and translations
        run: python3 tests/check_project.py
      - name: Install verified Godot and export templates
        shell: bash
        run: |
          base=https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable
          curl --fail --location --retry 2 --silent --show-error -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          echo "${GODOT_SHA256}  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          echo "GODOT=/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
          curl --fail --location --retry 2 --silent --show-error -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          echo "${TEMPLATES_SHA512}  /tmp/templates.tpz" | sha512sum -c -
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$dest/"
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          "$GODOT" --headless --path . --editor --import --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/import.log
      - name: Export packages
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -Po '(?<=config/version=")[^"]+' project.godot)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p build/windows build/linux build/macos build/server dist
          touch build/.gdignore dist/.gdignore
          "$GODOT" --headless --path . --export-release "Windows Desktop" build/windows/Hukum.exe
          "$GODOT" --headless --path . --export-release "Linux" build/linux/Hukum.x86_64
          "$GODOT" --headless --path . --export-release "macOS" build/macos/Hukum.zip
          "$GODOT" --headless --path . --export-release "Linux Dedicated Server" build/server/HukumServer.x86_64
          for d in windows linux server; do cp fonts/OFL-*.txt addons/kenney_ui_audio/LICENSE.txt "build/$d/" ; done
          (cd build/windows && zip -qr "../../dist/Hukum-$version-windows.zip" .)
          (cd build/linux && tar czf "../../dist/Hukum-$version-linux.tar.gz" .)
          cp build/macos/Hukum.zip "dist/Hukum-$version-macos-unsigned.zip"
          (cd build/server && tar czf "../../dist/HukumServer-$version-linux.tar.gz" .)
          ls -la dist
      - name: Smoke-test the Linux build
        shell: bash
        run: |
          set -o pipefail
          chmod +x build/linux/Hukum.x86_64 build/server/HukumServer.x86_64
          timeout 60 stdbuf -oL -eL build/linux/Hukum.x86_64 --headless --quit-after 300 2>&1 | tee /tmp/linux-run.log
          ! grep -E 'SCRIPT ERROR|Parse Error' /tmp/linux-run.log
          timeout 20 stdbuf -oL -eL build/server/HukumServer.x86_64 --headless -- --hukum-server --port=8799 > /tmp/server-run.log 2>&1 || true
          cat /tmp/server-run.log
          grep -q HUKUM_SERVER_READY /tmp/server-run.log
      - uses: actions/upload-artifact@v4
        with:
          name: hukum-${{ env.VERSION }}
          path: dist/*
          if-no-files-found: error
      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "HÜKÜM $GITHUB_REF_NAME" --notes "Windows, Linux, macOS (unsigned) and Linux dedicated server packages."
